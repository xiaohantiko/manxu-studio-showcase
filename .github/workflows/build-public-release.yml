name: Build and publish verified installers

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/build-public-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-package-release
  cancel-in-progress: true

jobs:
  macos:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 18
    outputs:
      version: ${{ steps.bundle.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build, unpack, and launch the macOS package
        id: bundle
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/packages"
          scratch=$(mktemp -d)
          extracted="$scratch/extracted"
          mounted=""
          smoke_pid=""
          cleanup() {
            if [[ -n "$smoke_pid" ]]; then
              kill "$smoke_pid" 2>/dev/null || true
              wait "$smoke_pid" 2>/dev/null || true
            fi
            if [[ -n "$mounted" ]]; then
              hdiutil detach "$mounted" -quiet || true
            fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          check_architectures() {
            executable_path=$1
            shift
            available=$(lipo -archs "$executable_path")
            for architecture in "$@"; do
              case " $available " in
                *" $architecture "*) ;;
                *) echo "Expected $architecture in $available" >&2; return 1 ;;
              esac
            done
          }
          smoke_start() {
            "$@" > "$scratch/smoke.log" 2>&1 &
            smoke_pid=$!
            sleep 5
            if ! kill -0 "$smoke_pid"; then
              cat "$scratch/smoke.log" >&2
              echo 'The packaged app exited during startup.' >&2
              return 1
            fi
            kill "$smoke_pid"
            wait "$smoke_pid" 2>/dev/null || true
            smoke_pid=""
          }
          mkdir -p "$output" "$extracted"
          npm ci
          npm run check
          npm run build
          CSC_IDENTITY_AUTO_DISCOVERY=false ./node_modules/.bin/electron-builder --mac dir --arm64 --publish never \
            --config.mac.identity=- --config.mac.hardenedRuntime=false
          app=$(find release -maxdepth 3 -type d -name '*.app' -print -quit)
          test -d "$app"
          asset=Manxu-Studio-macOS-arm64.dmg
          mkdir -p "$scratch/stage"
          ditto --norsrc --noextattr "$app" "$scratch/stage/$(basename "$app")"
          ln -s /Applications "$scratch/stage/Applications"
          hdiutil create -volname 'Manxu Studio' -srcfolder "$scratch/stage" -format UDZO "$output/$asset"
          hdiutil verify "$output/$asset"
          hdiutil attach -nobrowse -readonly -mountpoint "$extracted" "$output/$asset"
          mounted="$extracted"
          app=$(find "$extracted" -maxdepth 1 -type d -name '*.app' -print -quit)
          codesign --verify --deep --strict "$app"
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$(node -p "require('./package-lock.json').packages[''].version")"
          test "$version" = "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          check_architectures "$app/Contents/MacOS/$executable" arm64
          STUDIO_SMOKE=1 "$app/Contents/MacOS/$executable" > "$scratch/smoke.log" 2>&1
          grep -q 'MANXU_SMOKE' "$scratch/smoke.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-macos
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: packages
      - name: Publish a release for this source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.macos.outputs.version }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo 'A newer source snapshot is already queued.'
            exit 0
          fi
          cd packages
          shopt -s nullglob
          files=(*.zip *.dmg)
          test "${#files[@]}" -eq 1
          sha256sum "${files[@]}" > SHA256SUMS.txt
          tag="v$APP_VERSION"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "$tag already exists. Published versioned assets are immutable."
            exit 0
          fi
          notes="下载 DMG 并替换原位置的应用。安装包采用临时签名，尚未通过 Apple 公证。[使用说明](https://github.com/$GITHUB_REPOSITORY/blob/$tag/README.md) · [更新日志](https://github.com/$GITHUB_REPOSITORY/blob/$tag/CHANGELOG.md)"
          gh release create "$tag" "${files[@]}" SHA256SUMS.txt --target "$GITHUB_SHA" \
            --title "漫序 Studio $APP_VERSION · Mac 完整版" --notes "$notes" --latest -R "$GITHUB_REPOSITORY"
